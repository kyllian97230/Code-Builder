<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twitter Page Helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Twitter Page Helper</h1>
      <p>Interagit avec l'onglet Twitter/X actif.</p>

      <p id="result"></p>
    </main>
    <script src="popup.js"></script>
  </body>
